<!-- значок плитки «religion» страницы «Содержание» — рисунок Анри, 25.10.2026 (слово Рудольфа 13:15) -->
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FDF6E3"/><stop offset="100%" stop-color="#F8E8A8"/></linearGradient>
<radialGradient id="fl" cx="0.5" cy="0.2" r="0.8"><stop offset="0%" stop-color="#FDF6E3"/><stop offset="40%" stop-color="#C89E3A"/><stop offset="100%" stop-color="#B3262B"/></radialGradient>
<linearGradient id="wx" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FDF6E3"/><stop offset="100%" stop-color="#F8E8A8"/></linearGradient>
</defs>
<!-- книга -->

<path d="M8 40 C16 36 24 34 32 34 C40 34 48 36 56 40 L56 48 C48 44 40 42 32 42 C24 42 16 44 8 48 Z" fill="#7A4E2D" stroke="#3D2B1F" stroke-width="1.1" stroke-linejoin="round"/>
<path d="M8 40 C16 36 24 34 32 34 L32 42 C24 42 16 44 8 48 Z" fill="url(#pg)" stroke="#3D2B1F" stroke-width="0.9"/>
<path d="M56 40 C48 36 40 34 32 34 L32 42 C40 42 48 44 56 48 Z" fill="url(#pg)" stroke="#3D2B1F" stroke-width="0.9"/>
<path d="M32 34 L32 42" stroke="#3D2B1F" stroke-width="0.8"/>
<!-- свеча -->
<rect x="38" y="16" width="10" height="22" rx="2.5" fill="url(#wx)" stroke="#3D2B1F" stroke-width="1"/>
<rect x="42" y="14" width="2" height="4" rx="1" fill="#3D2B1F"/>
<!-- пламя мерцает -->
<g>
<ellipse cx="43" cy="10" rx="3.5" ry="5.5" fill="url(#fl)" stroke="#3D2B1F" stroke-width="0.6">
<animate attributeName="ry" values="5.5;4.8;5.8;5.5" dur="1.4s" repeatCount="indefinite"/>
<animate attributeName="rx" values="3.5;3.1;3.7;3.5" dur="1.4s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="43" cy="11" rx="1.2" ry="2" fill="#FDF6E3" opacity="0.9">
<animate attributeName="cy" values="11;10.5;11.2;11" dur="1.4s" repeatCount="indefinite"/>
</ellipse>
<animateTransform attributeName="transform" type="translate" values="0 0;0.3 -0.3;-0.2 0.2;0 0" dur="1.2s" repeatCount="indefinite"/>
</g>
</svg>
